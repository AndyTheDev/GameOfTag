version: '3.8'

services:
  app:
    build: .
    container_name: qr_game_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://andy:KLe9s7rHfU*f5a@postgres:5432/game_of_tag
      TZ: Europe/Prague
    depends_on:
      - postgres
    cap_drop:
      - ALL

  worker:
    build: .
    container_name: qr_game_worker
    restart: always
    environment:
      DATABASE_URL: postgres://andy:KLe9s7rHfU*f5a@postgres:5432/game_of_tag
      TZ: Europe/Prague
    depends_on:
      - postgres
    # Přepíšeme výchozí CMD z Dockerfile, aby se nespustil web, ale náš skript
    command: [ "npm", "run", "worker" ]

  caddy:
    image: caddy:latest
    container_name: qr_game_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile

  postgres:
    image: postgres:16
    container_name: game_of_tag_db
    restart: always
    environment:
      POSTGRES_USER: andy
      POSTGRES_PASSWORD: KLe9s7rHfU*f5a
      POSTGRES_DB: game_of_tag
      TZ: Europe/Prague
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
